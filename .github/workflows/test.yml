name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"

      - name: Run test
        # --runフラグを付与してウォッチモードを無効化し、CI上でハングするのを完全に防ぐ
        run: npm run test -- --run
        env:
          DATABASE_URL: "postgresql://mock:mock@localhost:5432/mock"
